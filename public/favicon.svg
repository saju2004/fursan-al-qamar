<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sky background circle -->
  <rect width="100" height="100" rx="20" fill="#0B132B"/>
  
  <!-- Stylized Skyscrapers -->
  <!-- Tower 1: Far Left -->
  <path d="M 28 42 L 38 35 L 38 72 L 28 72 Z" fill="#1D2D5E" />
  <rect x="30" y="44" width="2" height="3" fill="#FFFFFF" opacity="0.9"/>
  <rect x="34" y="44" width="2" height="3" fill="#FFFFFF" opacity="0.9"/>
  <rect x="30" y="50" width="2" height="3" fill="#FFFFFF" opacity="0.9"/>
  <rect x="34" y="50" width="2" height="3" fill="#FFFFFF" opacity="0.9"/>
  <rect x="30" y="56" width="2" height="3" fill="#FFFFFF" opacity="0.9"/>
  <rect x="34" y="56" width="2" height="3" fill="#FFFFFF" opacity="0.9"/>

  <!-- Tower 2: Center-Left Tallest -->
  <path d="M 40 24 L 54 16 L 54 74 L 40 74 Z" fill="#0B132B" stroke="#2A4683" stroke-width="0.5"/>
  <!-- Windows -->
  <g fill="#FFFFFF" opacity="0.95">
    <rect x="43" y="26" width="2.5" height="3" />
    <rect x="48" y="26" width="2.5" height="3" />
    <rect x="43" y="32" width="2.5" height="3" />
    <rect x="48" y="32" width="2.5" height="3" />
    <rect x="43" y="38" width="2.5" height="3" />
    <rect x="48" y="38" width="2.5" height="3" />
    <rect x="43" y="44" width="2.5" height="3" />
    <rect x="48" y="44" width="2.5" height="3" />
    <rect x="43" y="50" width="2.5" height="3" />
    <rect x="48" y="50" width="2.5" height="3" />
    <rect x="43" y="56" width="2.5" height="3" />
    <rect x="48" y="56" width="2.5" height="3" />
  </g>

  <!-- Tower 3: Center-Right -->
  <path d="M 54 28 L 66 22 L 66 74 L 54 74 Z" fill="#141F43" />
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="57" y="32" width="2.5" height="3" />
    <rect x="61.5" y="32" width="2.5" height="3" />
    <rect x="57" y="38" width="2.5" height="3" />
    <rect x="61.5" y="38" width="2.5" height="3" />
    <rect x="57" y="44" width="2.5" height="3" />
    <rect x="61.5" y="44" width="2.5" height="3" />
    <rect x="57" y="50" width="2.5" height="3" />
    <rect x="61.5" y="50" width="2.5" height="3" />
    <rect x="57" y="56" width="2.5" height="3" />
    <rect x="61.5" y="56" width="2.5" height="3" />
  </g>

  <!-- Tower 4: Far Right -->
  <path d="M 68 40 L 76 36 L 76 72 L 68 72 Z" fill="#1D2D5E" />
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="70.5" y="44" width="2" height="3" />
    <rect x="70.5" y="50" width="2" height="3" />
    <rect x="70.5" y="56" width="2" height="3" />
  </g>

  <!-- Sweeping Golden Crescent Moon at the base -->
  <path d="M 20 54 C 20 74 38 88 56 86 C 68 84 78 78 84 66 C 81 72 73 78 62 80 C 46 82 30 72 26 56 C 24 50 20 54 20 54 Z" fill="url(#goldGradient)" />
  
  <!-- Subtle Crescent tip flourish -->
  <path d="M 80 62 C 84 57 86 52 87 48 C 84 52 82 56 77 60 Z" fill="#B5892E"/>

  <defs>
    <linearGradient id="goldGradient" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#D8BE6E" />
      <stop offset="50%" stop-color="#B5892E" />
      <stop offset="100%" stop-color="#84621A" />
    </linearGradient>
  </defs>
</svg>
